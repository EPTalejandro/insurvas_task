[project]
name = "content-intel"
version = "0.1.0"
description = "Collects, labels and ranks public content from life insurance agents and agencies."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads these defaults on purpose: `session: Session = Depends(get_session)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
